<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#15211d" />
    <meta
      name="description"
      content="输入每 100g 的 kJ 和总克数，计算总 kJ 与总 kcal。"
    />
    <title>热量换算</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="calculator" aria-labelledby="app-title">
        <div class="topline">
          <p class="eyebrow">食品热量</p>
          <button class="ghost-button" id="clearButton" type="button">清空</button>
        </div>

        <header>
          <h1 id="app-title">热量换算</h1>
          <p>填包装上的每 100g kJ，再填你实际吃了多少 g。</p>
        </header>

        <form class="inputs" autocomplete="off">
          <label class="field">
            <span>每 100g</span>
            <div class="input-wrap">
              <input
                id="kjPer100"
                type="number"
                inputmode="decimal"
                min="0"
                step="0.1"
                placeholder="例如 1680"
                aria-describedby="kjHelp"
              />
              <span>kJ</span>
            </div>
          </label>

          <label class="field">
            <span>总重量</span>
            <div class="input-wrap">
              <input
                id="grams"
                type="number"
                inputmode="decimal"
                min="0"
                step="0.1"
                placeholder="例如 75"
              />
              <span>g</span>
            </div>
          </label>
        </form>

        <p class="hint" id="kjHelp">公式：总 kJ = 每 100g kJ × 总 g ÷ 100</p>

        <section class="results" aria-live="polite">
          <article class="result-card primary">
            <span>总 kcal</span>
            <strong id="totalKcal">0</strong>
          </article>
          <article class="result-card">
            <span>总 kJ</span>
            <strong id="totalKj">0</strong>
          </article>
        </section>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
