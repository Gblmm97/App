<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#15211d" />
    <meta
      name="description"
      content="输入每 100g 的 kJ 和总克数，计算总 kJ 与总 kcal。"
    />
    <title>热量换算</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="calculator" aria-labelledby="app-title">
        <div class="topline">
          <p class="eyebrow">食品热量</p>
          <div class="actions">
            <button
              class="icon-button"
              id="themeButton"
              type="button"
              aria-haspopup="true"
              aria-expanded="false"
              aria-controls="themePanel"
            >
              配色
            </button>
            <button class="ghost-button" id="clearButton" type="button">清空</button>
          </div>
        </div>

        <section class="theme-panel" id="themePanel" aria-label="选择配色" hidden>
          <button class="theme-option" type="button" data-theme="original">
            <span class="swatches" aria-hidden="true">
              <i style="background: #dd6f3a"></i>
              <i style="background: #b5d2c2"></i>
              <i style="background: #fffdf8"></i>
            </span>
            <span>原配色</span>
          </button>
          <button class="theme-option" type="button" data-theme="rosepine">
            <span class="swatches" aria-hidden="true">
              <i style="background: #d7827e"></i>
              <i style="background: #575279"></i>
              <i style="background: #faf4ed"></i>
            </span>
            <span>Rose Pine</span>
          </button>
          <button class="theme-option" type="button" data-theme="berry">
            <span class="swatches" aria-hidden="true">
              <i style="background: #d85a7f"></i>
              <i style="background: #f4c6d0"></i>
              <i style="background: #fff7f3"></i>
            </span>
            <span>奶油莓果</span>
          </button>
          <button class="theme-option" type="button" data-theme="matcha">
            <span class="swatches" aria-hidden="true">
              <i style="background: #6c8f62"></i>
              <i style="background: #bed5a5"></i>
              <i style="background: #fbf8ed"></i>
            </span>
            <span>抹茶绿</span>
          </button>
          <button class="theme-option" type="button" data-theme="sea">
            <span class="swatches" aria-hidden="true">
              <i style="background: #3f8ca5"></i>
              <i style="background: #b8ddea"></i>
              <i style="background: #fffaf1"></i>
            </span>
            <span>海盐蓝</span>
          </button>
          <button class="theme-option" type="button" data-theme="night">
            <span class="swatches" aria-hidden="true">
              <i style="background: #f0a66a"></i>
              <i style="background: #2f3552"></i>
              <i style="background: #f8f1e7"></i>
            </span>
            <span>夜间深色</span>
          </button>
        </section>

        <header>
          <h1 id="app-title">热量换算</h1>
          <p>填包装上的每 100g kJ，再填你实际吃了多少 g。</p>
        </header>

        <form class="inputs" autocomplete="off">
          <label class="field">
            <span>每 100g</span>
            <div class="input-wrap">
              <input
                id="kjPer100"
                type="number"
                inputmode="decimal"
                min="0"
                step="0.1"
                placeholder="例如 1680"
                aria-describedby="kjHelp"
              />
              <span>kJ</span>
            </div>
          </label>

          <label class="field">
            <span>总重量</span>
            <div class="input-wrap">
              <input
                id="grams"
                type="number"
                inputmode="decimal"
                min="0"
                step="0.1"
                placeholder="例如 75"
              />
              <span>g</span>
            </div>
          </label>
        </form>

        <p class="hint" id="kjHelp">公式：总 kJ = 每 100g kJ × 总 g ÷ 100</p>

        <section class="results" aria-live="polite">
          <article class="result-card primary">
            <span>总 kcal</span>
            <strong id="totalKcal">0</strong>
          </article>
          <article class="result-card">
            <span>总 kJ</span>
            <strong id="totalKj">0</strong>
          </article>
        </section>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
